  attraction.street: 골목 구경
  attraction.market: 시장 구경
  attraction.landmark: 동네 명소 구경
  activity: 놀거리
  activity.arcade: 오락 한 판
  activity.boardgame: 보드게임 한 판
  activity.craft: 원데이 클래스
  activity.escape: 방탈출 한 판
  activity.sports: 한 게임
  activity.photo: 셀프 사진 한 컷
  activity.karaoke: 노래 몇 곡
  activity.cinema: 영화 한 편
  culture: 전시 구경
  culture.museum: 박물관 구경
  culture.gallery: 미술관 구경
  culture.exhibition: 전시 구경
  culture.festival: 축제 구경
  culture.cinema: 영화 한 편
  culture.bookstore: 서점 구경
  bar: 한잔
  bar.pub: 맥주 한잔
  bar.wine: 와인 한잔
