# price: 숫자는 또렷하게, 출처는 짧게. "~쯤/정도" 같은 얼버무림은 쓰지 않는다(신빙성이 떨어진다).
# 그렇다고 추정치를 실제 가격처럼 말하지도 않는다 — 괄호 안의 근거 한 마디가 그 차이를 알려 준다.
price_lines:
  free: 무료라 예산이 그대로 남아요.
  measured: "{{ party }} {{ price }}원 (메뉴판 가격)."
  estimated: "{{ party }} {{ price }}원 (업종 평균가)."

# tag: 오늘 목적·고른 취향과 맞는 태그가 있을 때만 덧붙인다.
tag_line: "'{{ tag }}' 취향에도 맞아요."

# 취향이 아니라 사실인 태그는 "취향에도 맞아요"가 어색하다 → 그 사실을 그대로 말한다.
fact_lines:
  관광공사 소개: 한국관광공사가 소개한 곳이에요.
  착한가격업소: 정부가 지정한 착한가격업소예요.
  백년가게: 중소벤처기업부가 지정한 백년가게예요.
  모범음식점: 지자체가 지정한 모범음식점이에요.
  30년 넘은 집: 영업 신고한 지 30년이 넘은 집이에요.

# 동네 특색(domain.signature)에 해당하는 스톱에만 붙는다. 간판 통계에서 나온 사실만 말한다.
local_lines:
  specialty: "이 동네는 간판에 '{{ word }}'가 유독 많은, {{ word }} 동네예요."
  landmark: 이 동네 가게들이 이름을 빌려 쓸 만큼, 동네를 대표하는 곳이에요.

congestion_levels:
  - max: 0.35
    label: 여유
  - max: 0.65
    label: 보통
  - max: 1.01
    label: 혼잡

tips:
  budget_left: "짠! {{ left }}원 남으니까 디저트 하나 더 어때요?"
  budget_roomy: "이 동네에서 이 시간이면 {{ used }}원으로 충분해요. 남은 {{ left }}원은 아껴 두거나, 만나는 시간을 늘리면 한두 곳 더 넣어 드릴게요."
  budget_tight: "예산을 거의 딱 맞게 썼어요. 알뜰하게 다녀오세요!"
  budget_over: "예산을 {{ over }}원 넘겼어요. 메뉴를 하나 줄이면 맞출 수 있어요."
  crowded: "{{ name }}, 이 시간엔 붐벼요. 조금 서두르면 좋아요."
budget_left_tip_min: 3000
