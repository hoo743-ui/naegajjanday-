# Continuous delivery: main -> staging -> (manual approval) -> production
#
#   build ──> staging ──> production
#             │            └ waits for the required reviewers of the GitHub
#             │              Environment "production" (Settings > Environments)
#             └ migrate (one-off ECS task) -> rolling deploy -> smoke test
#               -> automatic rollback to the previous task definitions on failure
#
# Strategy: ECS ROLLING update with deployment circuit breaker + rollback, the
# same controller Terraform configures in infra/terraform/modules/ecs_service.
# No CodeDeploy blue/green.
#
# Auth: GitHub OIDC only, no long-lived AWS keys.
#   build role  (envs/shared)   trusts  repo:<repo>:ref:refs/heads/main
#   deploy role (envs/<env>)    trusts  repo:<repo>:environment:<staging|production>
#
# Required configuration
#   Repository variables : AWS_BUILD_ROLE_ARN, STAGING_SITE_URL, PRODUCTION_SITE_URL
#                          optional: ECR_REGISTRY, NEXT_PUBLIC_KAKAO_MAP_KEY
#   Environment variables: AWS_DEPLOY_ROLE_ARN, ECS_CLUSTER, NAME_PREFIX, BASE_URL
#                          (terraform output github_environment_variables)
#                          optional: MIGRATION_COMMAND, SMOKE_REGION
#   Secrets (optional)   : SLACK_WEBHOOK_URL

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/ci/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/_deploy-environment.yml"
  workflow_dispatch:

# Never run two deployments at once and never cancel one half-way.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_NAMESPACE: naegajjanday

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC -> AWS
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag = git sha
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, build role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          role-session-name: gha-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Repositories use IMMUTABLE tags, so a re-run must not push the same tag again.
      - name: Which images already exist?
        id: existing
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          exists() { aws ecr describe-images --repository-name "$1" --image-ids "imageTag=$2" >/dev/null 2>&1 && echo true || echo false; }
          {
            echo "api=$(exists "$ECR_NAMESPACE/api" "$TAG")"
            echo "web_staging=$(exists "$ECR_NAMESPACE/web" "$TAG-staging")"
            echo "web_production=$(exists "$ECR_NAMESPACE/web" "$TAG-production")"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push api
        if: steps.existing.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/api:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # NEXT_PUBLIC_* values are inlined by `next build`, so the web image is
      # environment specific: one build per environment, same git sha.
      - name: Build & push web (staging)
        if: steps.existing.outputs.web_staging != 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/web:${{ steps.meta.outputs.tag }}-staging
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_SITE_URL }}/v1
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_SITE_URL }}
            NEXT_PUBLIC_KAKAO_MAP_KEY=${{ vars.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push web (production)
        if: steps.existing.outputs.web_production != 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/web:${{ steps.meta.outputs.tag }}-production
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_SITE_URL }}/v1
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_SITE_URL }}
            NEXT_PUBLIC_KAKAO_MAP_KEY=${{ vars.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          cache-from: type=gha,scope=web

  staging:
    name: Staging
    needs: [build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: staging
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  production:
    name: Production
    needs: [build, staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: production
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
