name: CI / API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

env:
  UV_FROZEN: "1" # never re-resolve: uv.lock is the source of truth
  PYTHON_VERSION: "3.13" # Render runs 3.13 (render.yaml)

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  test:
    # Same database as local and production (Render runs SQLite on a disk): tests/conftest.py builds a
    # temporary SQLite file seeded from data/seed through the real ingestion pipeline, with no Redis,
    # search or LLM. The PostGIS path is not exercised anywhere, so CI does not pretend it is.
    # No env overrides here on purpose: an inherited RATE_LIMIT_ENABLED=false once broke the
    # rate-limit tests, because conftest only pins what the fixtures need.
    name: pytest (sqlite, like production)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Production start path on a fresh SQLite file
        # What Render's startCommand does (render.yaml), plus the seed loaders the e2e job uses.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-boot.db
        run: |
          uv run python -m app.cli db init
          uv run python -m app.cli seed-config
          uv run python -m app.cli ingest --provider file --all
          rm -f ci-boot.db

      - name: pytest
        run: >-
          uv run --with pytest-cov pytest -q
          --cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
          --junitxml=junit.xml --durations=15

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            rate=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))")
            echo "### API coverage: ${rate}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: |
            apps/api/coverage.xml
            apps/api/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Check for Dockerfile
        id: dockerfile
        working-directory: .
        run: |
          if [ -f apps/api/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/api/Dockerfile does not exist yet - image build skipped"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.present == 'true'

      - name: Build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          load: false
          tags: naegajjanday/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
