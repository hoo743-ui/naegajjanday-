name: CI / API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

env:
  UV_FROZEN: "1" # never re-resolve: uv.lock is the source of truth
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  test:
    name: pytest (postgis + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: naegajjanday
          POSTGRES_PASSWORD: naegajjanday
          POSTGRES_DB: naegajjanday_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naegajjanday -d naegajjanday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://naegajjanday:naegajjanday@localhost:5432/naegajjanday_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      LLM_PROVIDER: none
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Enable PostGIS extensions
        run: |
          PGPASSWORD=naegajjanday psql -h localhost -U naegajjanday -d naegajjanday_test \
            -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/infra/docker/postgres/init/01-extensions.sql"

      - name: Migrate
        # Alembic once revisions exist, otherwise the CLI bootstrap (create_all).
        run: |
          if [ -f alembic.ini ] && ls alembic/versions/*.py >/dev/null 2>&1; then
            uv run alembic upgrade head
          elif [ -f app/cli.py ] || [ -d app/cli ]; then
            uv run python -m app.cli db init
          else
            echo "::notice::no migrations or CLI yet - skipping"
          fi

      - name: pytest
        run: >-
          uv run --with pytest-cov pytest
          --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            rate=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))")
            echo "### API coverage: ${rate}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage.xml
            apps/api/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        working-directory: .
        run: |
          if [ -f apps/api/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/api/Dockerfile does not exist yet - image build skipped"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.present == 'true'

      - name: Build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: false
          tags: naegajjanday/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
