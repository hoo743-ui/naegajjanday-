version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 8
    labels: [dependencies, web]
    commit-message:
      prefix: "chore(web)"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript", "@types/*", "prettier*"]
      minor-and-patch:
        update-types: [minor, patch]

  # apps/api is a uv project (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 8
    labels: [dependencies, api]
    commit-message:
      prefix: "chore(api)"
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "types-*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /infra/docker/elasticsearch
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Elasticsearch must stay on the major version of the python client (8.x).
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/shared
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/prod
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    labels: [dependencies, infra]
    commit-message:
      prefix: "chore(infra)"
    ignore:
      # AWS provider 6.x has breaking changes (region handling); upgrade deliberately.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
