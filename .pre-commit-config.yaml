# pip install pre-commit (or: uv tool install pre-commit) && pre-commit install
# Hook versions are bumped with `pre-commit autoupdate`.
minimum_pre_commit_version: "3.5.0"

exclude: |
  (?x)^(
    index\.html|
    apps/web/public/mockServiceWorker\.js|
    apps/web/src/lib/api/schema\.gen\.ts|
    .*\.lock|
    .*package-lock\.json
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^apps/web/tsconfig\.json$ # JSON with comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat|cmd)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^(apps/web/|\.github/|docker-compose\.yml|.*\.md$)
        types_or: [javascript, jsx, ts, tsx, css, json, yaml, markdown]
        exclude: ^docs/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt # needs the terraform binary on PATH
        files: ^infra/terraform/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
